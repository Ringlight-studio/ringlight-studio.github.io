<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ringlight Studio</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #1b1722; --muted: #5d5868; --line: #e4e0ea; --accent: #b0306a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e0b14; --fg: #ece8f2; --muted: #a39db0; --line: #2a2433; --accent: #ff8fc0; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.65 system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 1.8rem; margin: 0 0 4px; }
  h2 { font-size: 1.2rem; margin: 32px 0 6px; }
  .muted { color: var(--muted); }
  a { color: var(--accent); }
  .card { border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
</style>
</head>
<body>
<main>
  <h1>Ringlight Studio</h1>
  <p class="muted">Small independent games.</p>

  <h2>Games</h2>
  <div class="card">
    <b>FOLLOWERS</b>
    <p>A text idle game about going from zero followers to something much bigger than an influencer. English and Korean.</p>
    <p><a href="./privacy/">Privacy Policy · 개인정보처리방침</a></p>
  </div>

  <h2>Contact</h2>
  <p><a href="mailto:fkfajsl@gmail.com">fkfajsl@gmail.com</a></p>
</main>
</body>
</html>
